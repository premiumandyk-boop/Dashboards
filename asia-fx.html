<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASIA FX DASHBOARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0f1117;
      --bg2:      #141720;
      --bg3:      #1a1e2a;
      --card:     #181c26;
      --card-h:   #1e2230;
      --border:   #2a2f3e;
      --border-h: #3a4055;
      --gold:     #d4a853;
      --gold-dim: #a07838;
      --text:     #dde2f0;
      --text2:    #8890aa;
      --text3:    #555e78;
      --green:    #52c98a;
      --green-bg: #0c2418;
      --green-b:  #1a4832;
      --red:      #e86060;
      --red-bg:   #260d0d;
      --red-b:    #4a1818;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'DM Mono', 'Courier New', monospace; color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    /* ── Header ── */
    .header { border-bottom: 1px solid var(--border); padding: 24px 24px 20px; background: var(--bg2); }
    .header-inner { max-width: 860px; margin: 0 auto; }
    .header-top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 5px; color: var(--gold); line-height: 1; }
    .subtitle { font-size: 11px; color: var(--text3); letter-spacing: 3px; margin-top: 5px; text-transform: uppercase; }
    .input-label { font-size: 11px; color: var(--text3); letter-spacing: 1px; margin-bottom: 4px; text-align: right; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    .dollar-sign { color: var(--gold); font-size: 20px; }
    .ainput {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; font-family: inherit; font-size: 20px; width: 150px;
      border-radius: 4px; outline: none; text-align: right; transition: border-color 0.2s;
    }
    .ainput:focus { border-color: var(--gold); }
    .header-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; flex-wrap: wrap; gap: 8px; }
    .status { font-size: 11px; color: var(--text3); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .status-dim { color: #2e3448; }
    .rbtn {
      background: none; border: 1px solid var(--border); color: var(--gold);
      padding: 8px 18px; cursor: pointer; font-family: inherit; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase; transition: all 0.2s; border-radius: 4px;
    }
    .rbtn:hover { background: var(--bg3); border-color: var(--gold); }
    .rbtn:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    input[type="date"]:focus { border-color: var(--gold); }

    /* ── Content ── */
    .content { max-width: 860px; margin: 0 auto; padding: 20px 24px 48px; }
    .error-box { background: var(--red-bg); border: 1px solid var(--red-b); border-radius: 4px; padding: 14px 18px; color: var(--red); font-size: 13px; margin-bottom: 16px; }

    /* column headers */
    .col-headers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
    .col-header { display: flex; justify-content: flex-end; gap: 6px; padding-right: 4px; }
    .col-label { font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; min-width: 58px; text-align: center; }

    /* USD row */
    .usd-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
      padding: 13px 16px; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; border-left: 3px solid var(--gold);
    }
    .usd-label { font-size: 10px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
    .usd-rate { font-size: 20px; color: var(--gold); }

    /* grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
      transition: all 0.18s; position: relative; overflow: hidden;
      animation: fi 0.35s ease forwards; opacity: 0;
      border-left: 3px solid transparent;
    }
    .card:hover { background: var(--card-h); border-color: var(--border-h); border-left-color: var(--gold-dim); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .card-flag { font-size: 26px; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .card-body { flex: 1; min-width: 0; }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
    .card-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .card-code { font-size: 10px; color: var(--text3); margin-left: 6px; letter-spacing: 1px; }
    .badges { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      border-radius: 3px; padding: 3px 7px; font-size: 11px; font-weight: 500;
      white-space: nowrap; border: 1px solid; letter-spacing: 0.3px;
    }
    .badge-up   { color: var(--green); background: var(--green-bg); border-color: var(--green-b); }
    .badge-down { color: var(--red);   background: var(--red-bg);   border-color: var(--red-b); }
    .badge-dim  { color: var(--text3); font-size: 10px; }
    .badge-dot  { color: #2e3448; font-size: 10px; }
    .card-rate { font-size: 12px; color: var(--text2); line-height: 1.4; }
    .rate-val { color: var(--gold); font-size: 13px; font-weight: 500; }
    .card-conv {
      font-size: 11px; color: var(--text2); border-top: 1px solid var(--border);
      padding-top: 6px; margin-top: 6px; line-height: 1.4;
    }
    .conv-val { color: var(--text); font-weight: 500; }

    /* skeleton */
    .skeleton-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .pulse { animation: pulse 1.5s ease-in-out infinite; border-radius: 3px; }

    /* legend + footer */
    .legend { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; font-size: 11px; color: var(--text3); align-items: center; }
    .legend-sep { color: #2a2f3e; }
    .footer { margin-top: 10px; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; color: var(--text3); line-height: 1.8; }

    @keyframes pulse { 0%,100%{opacity:0.25} 50%{opacity:0.6} }
    @keyframes fi { to { opacity: 1; } }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .col-headers { grid-template-columns: 1fr; }
      .col-headers .col-header:last-child { display: none; }
      .title { font-size: 36px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="title">ASIA FX</div>
        <div class="subtitle">USD 기준 실시간 환율</div>
      </div>
      <div>
        <div class="input-label">USD 금액 입력</div>
        <div class="input-row">
          <span class="dollar-sign">$</span>
          <input class="ainput" type="number" id="usdInput" value="1" min="0" placeholder="1" />
        </div>
      </div>
    </div>
    <div class="header-bottom">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="status" id="status"><span>로딩 중...</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <div style="font-size:10px;color:var(--text3);letter-spacing:1px;">기준일</div>
        <input type="date" id="datePicker"
          style="background:var(--bg3);border:1px solid var(--border);color:var(--text);
                 padding:7px 12px;font-family:inherit;font-size:12px;border-radius:4px;
                 outline:none;cursor:pointer;transition:border-color 0.2s;
                 color-scheme:dark;"
          onchange="onDateChange(this.value)"
        />
        <button class="rbtn" id="todayBtn" onclick="resetToToday()" style="padding:7px 14px;font-size:10px;">오늘</button>
        <button class="rbtn" id="refreshBtn" onclick="fetchAll(true)">⟳ 새로고침</button>
        <button class="rbtn" onclick="downloadHTML()" style="padding:7px 14px;font-size:10px;">↓ 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="content" id="content">
  <div class="grid" id="skeleton">
    <div class="skeleton-card"><div style="font-size:26px">🇰🇷</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇦🇺</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇻🇳</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇹🇼</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇮🇩</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇹🇭</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇵🇭</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
    <div class="skeleton-card"><div style="font-size:26px">🇲🇾</div><div style="flex:1"><div class="pulse" style="height:13px;width:60px;background:#222840;margin-bottom:8px"></div><div class="pulse" style="height:16px;width:110px;background:#1a1e2a"></div></div></div>
  </div>
</div>

<div id="outlookModal" onclick="if(event.target===this) closeOutlookModal()"
  style="display:none;position:fixed;inset:0;background:rgba(5,7,12,0.7);z-index:1000;align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--bg2);border:1px solid var(--border-h);border-radius:10px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,0.5);">
    <button onclick="closeOutlookModal()" aria-label="닫기"
      style="position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;line-height:1;padding:4px;">✕</button>
    <div id="outlookModalBody"></div>
  </div>
</div>

<script>
const CURRENCIES = [
  { code:"KRW", name:"한국",       flag:"🇰🇷" },
  { code:"AUD", name:"호주",       flag:"🇦🇺", invert:true },
  { code:"NZD", name:"뉴질랜드",    flag:"🇳🇿", invert:true },

  { code:"VND", name:"베트남",     flag:"🇻🇳" },
  { code:"TWD", name:"대만",       flag:"🇹🇼" },
  { code:"IDR", name:"인도네시아", flag:"🇮🇩" },
  { code:"THB", name:"태국",       flag:"🇹🇭" },
  { code:"PHP", name:"필리핀",     flag:"🇵🇭" },
  { code:"MYR", name:"말레이시아", flag:"🇲🇾" },
  { code:"SGD", name:"싱가포르",   flag:"🇸🇬" },
  { code:"CNY", name:"중국",       flag:"🇨🇳" },
  { code:"HKD", name:"홍콩",       flag:"🇭🇰" },
  { code:"JPY", name:"일본",       flag:"🇯🇵" },
  { code:"INR", name:"인도",       flag:"🇮🇳" },
];
const CDN_KEY = {KRW:"krw",AUD:"aud",NZD:"nzd",INR:"inr",VND:"vnd",TWD:"twd",IDR:"idr",THB:"thb",PHP:"php",MYR:"myr",SGD:"sgd",CNY:"cny",HKD:"hkd",JPY:"jpy"};

let rates={}, yoyRates={cur:{},prev:{}}, ytdRates={cur:{},prev:{}}, mtdRates={cur:{},prev:{}};
let loadingYoy=true, loadingYtd=true, loadingMtd=true;
let fcastRefRates={m1:{},m3:{}}, loadingFcastRef=true;
let policyRates={}, loadingPolicyRates=true;
const POLICY_AREA_TO_CCY = { KR:'KRW', AU:'AUD', NZ:'NZD', ID:'IDR', TH:'THB', PH:'PHP', MY:'MYR', CN:'CNY', HK:'HKD', JP:'JPY', IN:'INR' };

async function fetchPolicyRates() {
  const areas = Object.keys(POLICY_AREA_TO_CCY).concat('US').join('+');
  const url = `https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CBPOL/1.0/M.${areas}?format=sdmx-json&lastNObservations=1`;
  try {
    const r = await fetch(url);
    if (!r.ok) return {};
    const d = await r.json();
    const ds = d.data.dataSets[0];
    const seriesDims = d.data.structure.dimensions.series;
    const areaIdx = seriesDims.findIndex(x => x.id === 'REF_AREA');
    const areaDim = seriesDims[areaIdx];
    const out = {};
    Object.entries(ds.series).forEach(([key, s]) => {
      const idxs = key.split(':').map(Number);
      const area = areaDim.values[idxs[areaIdx]].id;
      const obsKeys = Object.keys(s.observations);
      if (!obsKeys.length) return;
      out[area] = s.observations[obsKeys[obsKeys.length - 1]][0];
    });
    return out;
  } catch { return {}; }
}

const toISO = d => d.toISOString().split("T")[0];
const toLocalISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const prevWD = d => { const r=new Date(d); while(r.getDay()===0||r.getDay()===6) r.setDate(r.getDate()-1); return r; };
const nextWD = d => { const r=new Date(d); while(r.getDay()===0||r.getDay()===6) r.setDate(r.getDate()+1); return r; };
const clamp  = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

// 선택된 날짜 기반 동적 변수
let selectedDate = prevWD(new Date());

function getDateVars(base) {
  const d  = new Date(base);
  const CY = d.getFullYear(), PY = CY - 1;
  const CM = d.getMonth();
  return {
    CY, PY, CM,
    yearAgoISO:       toLocalISO(prevWD(new Date(PY, CM, d.getDate()))),
    ytdStartISO:      toLocalISO(prevWD(new Date(CY, 0, 2))),
    ytdEndISO:        toLocalISO(prevWD(new Date(d))),
    prevYtdStartISO:  toLocalISO(prevWD(new Date(PY, 0, 2))),
    prevYtdEndISO:    toLocalISO(prevWD(new Date(PY, CM, d.getDate()))),
    mtdStartISO:      toLocalISO(nextWD(new Date(CY, CM, 1))),
    mtdEndISO:        toLocalISO(prevWD(new Date(d))),
    prevMtdStartISO:  toLocalISO(nextWD(new Date(PY, CM, 1))),
    prevMtdEndISO:    toLocalISO(prevWD(new Date(PY, CM, d.getDate()))),
    // 1M/3M 후 시점의 "1년 전" 기준일 → 예상 미래환율과 비교해 미래 전년비 산출
    fcastRef1mISO:    toLocalISO(prevWD(new Date(PY, CM+1, d.getDate()))),
    fcastRef3mISO:    toLocalISO(prevWD(new Date(PY, CM+3, d.getDate()))),
  };
}

let { CY, PY, CM, yearAgoISO, ytdStartISO, ytdEndISO, prevYtdStartISO, prevYtdEndISO, mtdStartISO, mtdEndISO, prevMtdStartISO, prevMtdEndISO, fcastRef1mISO, fcastRef3mISO } = getDateVars(selectedDate);

function fmtRate(code, rate, invert) {
  if (!rate) return "—";
  const v = invert ? 1/rate : rate;
  if (["KRW","VND","IDR"].includes(code)) return v.toLocaleString("ko-KR",{maximumFractionDigits:0});
  if (["JPY","INR"].includes(code)) return v.toLocaleString("ko-KR",{maximumFractionDigits:1});
  return v.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:4});
}
function fmtConv(code, rate, invert, amount) {
  if (!rate||!amount) return "—";
  const v = invert ? amount/rate : rate*amount;
  if (["KRW","VND","IDR"].includes(code)) return v.toLocaleString("ko-KR",{maximumFractionDigits:0});
  if (["JPY","INR"].includes(code)) return v.toLocaleString("ko-KR",{maximumFractionDigits:1});
  return v.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function calcPct(cur, pre, invert) {
  if (!cur||!pre||isNaN(cur)||isNaN(pre)) return null;
  const c=invert?1/cur:cur, p=invert?1/pre:pre;
  return invert ? (c-p)/p*100 : -(c-p)/p*100;
}

async function cdnFetch(dateISO) {
  const tag = dateISO || "latest";
  const urls = [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/usd.json`,
    `https://latest.currency-api.pages.dev/v1/currencies/usd.json`,
  ];
  for (const url of (dateISO ? [urls[0]] : urls)) {
    try {
      const r = await fetch(url, {cache:"no-store"});
      if (!r.ok) continue;
      const d = await r.json();
      if (!d.usd) continue;
      const out={};
      CURRENCIES.forEach(c => { const v=d.usd[CDN_KEY[c.code]]; if(v) out[c.code]=v; });
      return out;
    } catch {}
  }
  return {};
}
async function cdnAvg(startISO, endISO) {
  const dates=[], cur=new Date(startISO), end=new Date(endISO);
  while(cur<=end){ dates.push(toISO(prevWD(new Date(cur)))); cur.setDate(cur.getDate()+28); }
  if(!dates.includes(endISO)) dates.push(endISO);
  const sums={}, counts={};
  for (const d of dates) {
    try {
      const row = await cdnFetch(d);
      Object.entries(row).forEach(([c,v])=>{ sums[c]=(sums[c]||0)+v; counts[c]=(counts[c]||0)+1; });
    } catch {}
  }
  const out={};
  Object.keys(sums).forEach(c=>{ out[c]=sums[c]/counts[c]; });
  return out;
}

function badgeHTML(pct, loading) {
  if (loading) return `<span class="badge-dot">···</span>`;
  if (pct===null||pct===undefined||isNaN(pct)) return `<span class="badge-dim">—</span>`;
  const up=pct>=0, abs=Math.abs(pct).toFixed(1);
  return `<span class="badge ${up?'badge-up':'badge-down'}">${up?'▲':'▼'} ${abs}%</span>`;
}

// ── 3-Factor 모델 통화별 가중치 ─────────────────────────────
// Global USD / 금리·정책 / 로컬흐름·펀더멘털
const FX_OUTLOOK_WEIGHTS = {
  KRW: { global:0.40, policy:0.20, flow:0.40 }, // 외국인flow·반도체수출, 금리차 설명력 제한적
  JPY: { global:0.30, policy:0.40, flow:0.30 }, // BOJ정상화·carry unwind 최우선
  IDR: { global:0.35, policy:0.35, flow:0.30 },
  PHP: { global:0.35, policy:0.35, flow:0.30 },
  INR: { global:0.35, policy:0.35, flow:0.30 },
  CNY: { global:0.30, policy:0.25, flow:0.45 }, // PBOC fixing·자본흐름·중국경기
  AUD: { global:0.30, policy:0.35, flow:0.35 }, // commodity·China cycle
  NZD: { global:0.30, policy:0.35, flow:0.35 },
  VND: { global:0.35, policy:0.35, flow:0.30 },
  TWD: { global:0.35, policy:0.35, flow:0.30 },
  THB: { global:0.35, policy:0.35, flow:0.30 },
  MYR: { global:0.35, policy:0.35, flow:0.30 },
  SGD: { global:0.35, policy:0.35, flow:0.30 },
  HKD: { global:0.35, policy:0.35, flow:0.30 },
};

// ── 통화별 금리·흐름 요인 한줄 메모 (참고용) ─────────────────
const FX_DRIVER_NOTES = {
  KRW: { policy:'실제 금리차 있으나 DXY 통제시 설명력 제한(연구결과) → 가중치 20%로 축소', flow:'외국인 증권투자·반도체 수출' },
  JPY: { policy:'BOJ 정상화 속도',        flow:'carry trade 청산·개입 경계' },
  AUD: { policy:'RBA 금리',              flow:'원자재가·중국 경기' },

// ── FX OUTLOOK: 3-Factor 추세 모델 ──────────────────────────
const FCAST_MAX_1M = 4;  // score dev ±50 → 예상 절상/절하 ±4% (1개월)
const FCAST_MAX_3M = 8;  // score dev ±50 → 예상 절상/절하 ±8% (3개월)

let lastOutlookData = null, lastBasketYoY = null;

function computeOutlook() {
  if (loadingYoy || loadingYtd || loadingMtd || loadingFcastRef) return null;

  // 바스켓 평균 YoY → USD 광역 강도 프록시
  let bSum = 0, bCnt = 0;
  CURRENCIES.forEach(c => {
    const y = calcPct(yoyRates.cur[c.code], yoyRates.prev[c.code], c.invert);
    if (y !== null && !isNaN(y)) { bSum += y; bCnt++; }
  });
  const basketYoY = bCnt > 0 ? bSum / bCnt : 0;
  lastBasketYoY = basketYoY;

  const result = CURRENCIES.map(c => {
    const w   = FX_OUTLOOK_WEIGHTS[c.code] || { global:0.34, policy:0.33, flow:0.33 };
    const yoy = calcPct(yoyRates.cur[c.code], yoyRates.prev[c.code], c.invert);
    const ytd = calcPct(ytdRates.cur[c.code], ytdRates.prev[c.code], c.invert);
    const mtd = calcPct(mtdRates.cur[c.code], mtdRates.prev[c.code], c.invert);

    if ([yoy,ytd,mtd].some(v => v===null||isNaN(v))) {
      return { code:c.code, flag:c.flag, name:c.name, invert:c.invert,
               rate:rates[c.code], yoy, ytd, mtd, score:null, factors:null };
    }

    // Factor 1 — Global USD: 이 통화의 YoY vs 바스켓 평균, USD 광역 방향 반영
    const relStrength = yoy - basketYoY;
    const globalScore = clamp(50 + basketYoY * 2.5 + relStrength * 1.5, 0, 100);

    // Factor 2 — 금리·정책: BIS 공식 중앙은행 정책금리 실측 데이터 우선 사용
    // (한국은행 vs Fed 등 실제 정책금리차, bp 단위) · 데이터 없는 통화(VND/TWD/SGD)만 모멘텀 프록시로 대체
    const usRate = policyRates.US, localRate = policyRates[c.code];
    const hasRealRate = usRate != null && localRate != null;
    const rateDiffPp = hasRealRate ? (localRate - usRate) : null; // percentage point
    const policyScore = hasRealRate
      ? clamp(50 + rateDiffPp * 8, 0, 100)
      : clamp(50 + (mtd - ytd) * 5, 0, 100); // 프록시 fallback

    // Factor 3 — 로컬 흐름: YoY 방향·강도, YTD 일치 여부 보너스
    const sameDir = (yoy >= 0) === (ytd >= 0);
    const flowScore = clamp(50 + yoy * 3.5 + (sameDir ? 5 : -5), 0, 100);

    const composite = w.global * globalScore + w.policy * policyScore + w.flow * flowScore;
    // 1M: 단기 모멘텀 우선
    const score1m = clamp(0.25*globalScore + 0.45*policyScore + 0.30*flowScore, 0, 100);

    const sig = s => s > 58 ? '▲' : s < 42 ? '▼' : '→';
    const signal1m = sig(score1m), signal3m = sig(composite);

    const dir = s => s > 55 ? 1 : s < 45 ? -1 : 0;
    const agrees = [globalScore,policyScore,flowScore].filter(s => dir(s)===dir(composite)).length;
    const confidence = agrees === 3 ? 'HIGH' : agrees === 2 ? 'MED' : 'LOW';

    // 예상 절상/절하 % (score 편차 → 크기로 환산, 휴리스틱)
    const mag1m = (score1m  - 50) / 50 * FCAST_MAX_1M;
    const mag3m = (composite - 50) / 50 * FCAST_MAX_3M;

    // 그 폭만큼 움직였다고 가정한 미래 raw rate → fmtRate로 그대로 표시 가능
    const raw = rates[c.code];
    const projRaw = pct => c.invert ? raw / (1 + pct/100) : raw * (1 - pct/100);
    const projRaw1m = raw ? projRaw(mag1m) : null;
    const projRaw3m = raw ? projRaw(mag3m) : null;

    // 그 시점의 "1년 전" 실제 환율과 비교 → 미래 시점의 전년비 추정
    const ref1m = fcastRefRates.m1[c.code], ref3m = fcastRefRates.m3[c.code];
    const futureYoy1m = (projRaw1m && ref1m) ? calcPct(projRaw1m, ref1m, c.invert) : null;
    const futureYoy3m = (projRaw3m && ref3m) ? calcPct(projRaw3m, ref3m, c.invert) : null;

    return {
      code:c.code, flag:c.flag, name:c.name, invert:c.invert, rate:rates[c.code],
      yoy, ytd, mtd, weights:w, basketYoY, agrees,
      rateInfo: hasRealRate ? { real:true, localRate, usRate, diffBp: Math.round(rateDiffPp*100) } : { real:false },
      factors:{ global:Math.round(globalScore), policy:Math.round(policyScore), flow:Math.round(flowScore) },
      composite:Math.round(composite), score1m:Math.round(score1m),
      signal1m, signal3m, confidence,
      mag1m, mag3m, projRaw1m, projRaw3m, futureYoy1m, futureYoy3m,
    };
  });
  lastOutlookData = result;
  return result;
}

function outlookSummarySentence(d, horizon) {
  const is1m = horizon === '1m';
  const mag  = is1m ? d.mag1m : d.mag3m;
  const w    = is1m ? { global:0.25, policy:0.45, flow:0.30 } : d.weights;

  const factors = [
    { key:'global', score:d.factors.global, weight:w.global },
    { key:'policy', score:d.factors.policy, weight:w.policy },
    { key:'flow',   score:d.factors.flow,   weight:w.flow   },
  ].map(f => ({ ...f, push: (f.score - 50) * f.weight }));
  factors.sort((a,b) => Math.abs(b.push) - Math.abs(a.push));

  const describe = f => {
    const strong = f.score > 60, weak = f.score < 40;
    if (f.key === 'global') {
      if (strong) return '최근 다른 아시아 통화들에 비해 달러 대비 상대적으로 강세를 보이고 있고';
      if (weak)   return '최근 다른 아시아 통화들에 비해 달러 대비 상대적으로 약세를 보이고 있고';
      return '달러 대비 전반적인 방향성은 뚜렷하지 않고';
    }
    if (f.key === 'policy') {
      if (d.rateInfo.real) {
        const bp = d.rateInfo.diffBp;
        if (bp > 30)  return `미국보다 정책금리가 ${bp}bp 더 높아서 돈이 몰릴 유인이 있고`;
        if (bp < -30) return `미국보다 정책금리가 ${Math.abs(bp)}bp 더 낮아서 돈이 빠져나갈 유인이 있고`;
        return `미국과의 정책금리 차이(${bp>=0?'+':''}${bp}bp)가 크지 않아 금리 요인의 영향은 제한적이고`;
      }
      if (strong) return '최근 한 달간 통화가 강세로 움직이는 단기 흐름이 나타나고 있고';
      if (weak)   return '최근 한 달간 통화가 약세로 움직이는 단기 흐름이 나타나고 있고';
      return '단기적인 방향성은 뚜렷하지 않고';
    }
    if (strong) return '지난 1년간 강세 흐름이 꾸준히 이어지고 있어';
    if (weak)   return '지난 1년간 약세 흐름이 꾸준히 이어지고 있어';
    return '뚜렷한 방향성 없이 등락을 반복하고 있어';
  };

  const [top, second] = factors;
  const dirWord = mag > 0.3 ? '강세(절상)' : mag < -0.3 ? '약세(절하)' : '보합';
  const sameDirection = (top.push >= 0) === (second.push >= 0) || (Math.abs(second.push) < 0.5);

  let s = `${d.name}(${d.code})은(는) ${describe(top)} `;
  s += sameDirection
    ? `${describe(second)} 두 요인이 비슷한 방향을 가리키고 있습니다. `
    : `반대로 ${describe(second)} 이 부분은 반대 방향으로 작용하고 있어 힘이 서로 상쇄되는 편입니다. `;
  s += `이를 종합하면 ${is1m?'1개월':'3개월'} 뒤에는 ${dirWord} 쪽으로 ${Math.abs(mag).toFixed(1)}%가량 움직일 것으로 추정됩니다.`;

  if (d.confidence === 'LOW') s += ' 다만 세 요인의 방향이 엇갈리는 편이라 확신도는 낮으니 참고 정도로만 봐주세요.';
  else if (d.confidence === 'HIGH') s += ' 세 요인이 대체로 같은 방향을 가리키고 있어 상대적으로 확신도가 높은 편입니다.';

  return s;
}

    ${row('로컬 흐름', note.flow || '—')}

function showOutlookDetail(code, horizon) {
  if (!lastOutlookData) return;
  const d = lastOutlookData.find(x => x.code === code);
  if (!d || !d.factors) return;
  document.getElementById('outlookModalBody').innerHTML = outlookDetailHTML(d, horizon);
  document.getElementById('outlookModal').style.display = 'flex';
}

function closeOutlookModal() {
  const m = document.getElementById('outlookModal');
  if (m) m.style.display = 'none';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOutlookModal(); });

function renderFxOutlook() {
  const data = computeOutlook();
  const loading = loadingYoy || loadingYtd || loadingMtd || loadingFcastRef;

  const pressureBar = (score, w=64) => {
    const dev  = score - 50;
    const fill = Math.abs(dev) * 2; // 0~100% of half-bar
    const col  = dev > 0 ? 'var(--green)' : dev < 0 ? 'var(--red)' : 'transparent';
    const half = w / 2;
    const filledPx = Math.round(half * fill / 100);
    return `<div style="display:flex;width:${w}px;height:5px;border-radius:3px;overflow:hidden;background:var(--bg3)">
      <div style="width:${half}px;display:flex;justify-content:flex-end">
        ${dev < 0 ? `<div style="width:${filledPx}px;background:${col}"></div>` : ''}
      </div>
      <div style="width:1px;background:var(--border-h);flex-shrink:0"></div>
      <div style="width:${half}px">
        ${dev > 0 ? `<div style="width:${filledPx}px;background:${col}"></div>` : ''}
      </div>
    </div>`;
  };

  const scoreBar = (label, score) => `
    <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
      <span style="font-size:8px;color:var(--text3);width:28px;text-align:right;flex-shrink:0">${label}</span>
      ${pressureBar(score)}
      <span style="font-size:8px;color:${score>55?'var(--green)':score<45?'var(--red)':'var(--text3)'};width:22px">${score}</span>
    </div>`;

  const confCol = c => c==='HIGH'?'var(--green)':c==='MED'?'var(--gold)':'var(--text3)';
  const confBg  = c => c==='HIGH'?'var(--green-bg)':c==='MED'?'rgba(212,168,83,0.12)':'var(--bg3)';
  const confBdr = c => c==='HIGH'?'var(--green-b)':c==='MED'?'var(--gold-dim)':'var(--border)';

  // 절상/절하 예상폭 + 미래 전년비 표시 헬퍼
  const arrowFor = pct => pct > 0.3 ? '▲' : pct < -0.3 ? '▼' : '→';
  const magCol   = pct => pct==null||isNaN(pct) ? 'var(--text3)' : pct>0.3?'var(--green)':pct<-0.3?'var(--red)':'var(--text3)';
  const fmtMag   = pct => pct==null||isNaN(pct) ? '—' : `${arrowFor(pct)} ${Math.abs(pct).toFixed(1)}%`;
  const fmtYoy   = pct => pct==null||isNaN(pct) ? '—' : `${pct>=0?'+':''}${pct.toFixed(1)}%`;

  // Forecast 3M FX Impact (매출 비중 통화, 실제 예상 절상/절하폭 가중평균)
  let fWsum=0, fWtotal=0;
  if (data) {
    data.forEach(d => {
      const w = WEIGHTS[d.code];
      if (!w || d.mag3m == null) return;
      fWsum   += d.mag3m * w;
      fWtotal += w;
    });
  }
  const fcastAvg  = fWtotal > 0 ? fWsum / fWtotal : 0;
  const fcastPct  = fcastAvg.toFixed(1);
  const fcastDir  = fcastAvg >= 0.1 ? '▲' : fcastAvg <= -0.1 ? '▼' : '→';
  const fcastCol  = fcastAvg >= 0 ? 'var(--green)' : 'var(--red)';

  const rows = loading
    ? '<div style="padding:20px;text-align:center;color:var(--text3);font-size:11px">···  로딩 중</div>'
    : (data||[]).map(d => {
        const rateStr = d.rate ? (d.invert ? fmtRate(d.code,d.rate,true)+' USD' : fmtRate(d.code,d.rate)+' '+d.code) : '—';
        if (!d.factors) return `
          <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
            <div style="width:22px;font-size:16px;text-align:center">${d.flag}</div>
            <div style="width:62px;font-size:11px;color:var(--text2)">${d.name}</div>
            <div style="flex:1;font-size:10px;color:var(--text3)">데이터 없음</div>
          </div>`;
        const note = FX_DRIVER_NOTES[d.code];
        return `
          <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
            <div style="width:22px;font-size:16px;text-align:center">${d.flag}</div>
            <div style="width:62px">
              <div style="font-size:11px;color:var(--text2)">${d.name}</div>
              <div style="font-size:9px;color:var(--text3)">${d.code}</div>
            </div>
            <div style="width:78px;font-size:10px;color:var(--gold);text-align:right">${rateStr}</div>
            <div style="flex:1;min-width:130px">
              ${scoreBar('USD',  d.factors.global)}
              ${scoreBar('금리', d.factors.policy)}
              ${scoreBar('흐름', d.factors.flow)}
              ${note ? `<div style="font-size:7px;color:var(--text3);line-height:1.5;margin-top:2px">금리 ${d.rateInfo.real ? `${d.rateInfo.localRate}%-美${d.rateInfo.usRate}%=${d.rateInfo.diffBp>=0?'+':''}${d.rateInfo.diffBp}bp` : note.policy} · 흐름 ${note.flow}</div>` : ''}
            </div>
            <div style="width:52px;text-align:center">
              <div style="font-size:12px;font-weight:600;color:${magCol(d.yoy)}">${fmtYoy(d.yoy)}</div>
              <div style="font-size:8px;color:var(--text3)">현재</div>
            </div>
            <div style="width:66px;text-align:center;cursor:pointer" onclick="showOutlookDetail('${d.code}','1m')" title="자세히 보기">
              <div style="font-size:12px;font-weight:600;color:${magCol(d.mag1m)};border-bottom:1px dotted var(--text3)">${fmtMag(d.mag1m)}</div>
              <div style="font-size:8px;color:var(--text3);margin-top:2px">YoY→<span style="color:${magCol(d.futureYoy1m)}">${fmtYoy(d.futureYoy1m)}</span></div>
            </div>
            <div style="width:66px;text-align:center;cursor:pointer" onclick="showOutlookDetail('${d.code}','3m')" title="자세히 보기">
              <div style="font-size:12px;font-weight:600;color:${magCol(d.mag3m)};border-bottom:1px dotted var(--text3)">${fmtMag(d.mag3m)}</div>
              <div style="font-size:8px;color:var(--text3);margin-top:2px">YoY→<span style="color:${magCol(d.futureYoy3m)}">${fmtYoy(d.futureYoy3m)}</span></div>
            </div>
            <div style="width:38px;text-align:center">
              <div style="font-size:9px;font-weight:600;padding:2px 4px;border-radius:3px;
                background:${confBg(d.confidence)};border:1px solid ${confBdr(d.confidence)};
                color:${confCol(d.confidence)}">${d.confidence}</div>
            </div>
          </div>`;
      }).join('');

  return `
    <div style="margin-top:20px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden">

      <!-- 헤더 -->
      <div style="padding:16px 20px 12px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--gold);margin-bottom:2px">
              FX OUTLOOK
            </div>
            <div style="font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase">
              3-Factor 추세 모델 · 14개 통화 · 통화별 가중치 차등 적용
            </div>
          </div>
          <div style="font-size:9px;color:var(--text3);line-height:1.8;text-align:right">
            KRW: <span style="color:var(--text2)">USD 40% · 로컬 40% · 금리 20%</span><br>
            JPY: <span style="color:var(--text2)">금리 40% · USD 30% · 로컬 30%</span>
          </div>
        </div>
      </div>

      <!-- 컬럼 헤더 -->
      <div style="padding:0 20px">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="width:22px"></div>
          <div style="width:62px;font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase">통화</div>
          <div style="width:78px;font-size:9px;color:var(--text3);letter-spacing:1px;text-align:right">현재환율</div>
          <div style="flex:1;font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase">FX PRESSURE&nbsp;&nbsp;←약세·강세→&nbsp;&nbsp;(USD · 금리 · 흐름)</div>
          <div style="width:52px;font-size:9px;color:var(--text3);text-align:center">현재<br>전년비</div>
          <div style="width:66px;font-size:9px;color:var(--text3);text-align:center">1M 예상 ⓘ<br>(→미래전년비)</div>
          <div style="width:66px;font-size:9px;color:var(--text3);text-align:center">3M 예상 ⓘ<br>(→미래전년비)</div>
          <div style="width:38px;font-size:9px;color:var(--text3);text-align:center">신뢰도</div>
        </div>
      </div>

      <!-- 통화별 행 -->
      <div style="padding:0 20px 4px;overflow-x:auto">
        <div style="min-width:680px">
          ${rows}
        </div>
      </div>

      <!-- Actual YTD → Forecast 3M -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border);margin-top:8px">
        <div style="background:var(--bg2);padding:14px 20px">
          <div style="font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">Actual YTD FX Impact</div>
          <div style="font-size:10px;color:var(--text3)">위 ASIA FX IMPACT 섹션 YTD 수치 참조</div>
        </div>
        <div style="background:var(--bg2);padding:14px 20px;text-align:center">
          <div style="font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">Forecast Next 3M FX Impact</div>
          ${loading
            ? `<span style="color:var(--text3);font-size:13px">···</span>`
            : `<div style="display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:${fcastCol}">
                ${fcastDir} ${Math.abs(fcastPct)}%
                <span style="font-size:10px;color:var(--text3)">추정</span>
              </div>`
          }
          <div style="font-size:9px;color:var(--text3);margin-top:4px">매출비중 가중 · 통화별 예상 절상/절하폭 기반</div>
        </div>
      </div>

      <!-- 정확도 & 면책 -->
      <div style="padding:12px 20px;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div style="font-size:10px;color:var(--text3);line-height:1.8">
            1M/3M 첫줄 = 예상 절상(▲)/절하(▼)폭 &nbsp;·&nbsp; 둘째줄 YoY→ = 그만큼 움직였을 때 그 시점의 전년비 &nbsp;·&nbsp; <span style="color:var(--gold)">수치 클릭 시 산출근거 상세 팝업</span><br>
            FX Pressure: 50 기준 우측=강세압력 / 좌측=약세압력 &nbsp;·&nbsp;
            추세 기반 모델, 폭은 점수 편차를 단순 선형 환산한 추정치 · 금리는 BIS 공식 정책금리(11개국) 반영, VND·TWD·SGD는 데이터 미제공으로 모멘텀 프록시 사용 · 자본흐름은 정성적 참고용
          </div>
          <div style="font-size:10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px 12px;color:var(--text3);white-space:nowrap">
            3M Direction Hit Rate<br>
            <span style="color:var(--gold);font-size:12px;font-weight:500">백테스트 미적용</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderGrid() {
  const amount = parseFloat(document.getElementById('usdInput').value) || 0;
  const content = document.getElementById('content');

  let html = `
    <div class="col-headers">
      <div class="col-header"><span class="col-label">전년비</span><span class="col-label">MTD동기</span><span class="col-label">YTD동기</span></div>
      <div class="col-header"><span class="col-label">전년비</span><span class="col-label">MTD동기</span><span class="col-label">YTD동기</span></div>
    </div>
    <div class="usd-row">
      <span style="font-size:26px;line-height:1">🇺🇸</span>
      <div style="flex:1">
        <div class="usd-label">기준통화 · US Dollar</div>
        <div class="usd-rate">USD 1 = $ 1.00</div>
      </div>
      ${amount>0&&amount!==1 ? `<div style="font-size:13px;color:#8890aa">$${amount.toLocaleString()} USD</div>` : ''}
    </div>
    <div class="grid">`;

  CURRENCIES.forEach((c, i) => {
    const rate   = rates[c.code];
    const yoyPct = calcPct(yoyRates.cur[c.code], yoyRates.prev[c.code], c.invert);
    const ytdPct = calcPct(ytdRates.cur[c.code], ytdRates.prev[c.code], c.invert);
    const mtdPct = calcPct(mtdRates.cur[c.code], mtdRates.prev[c.code], c.invert);
    const rateStr = c.invert
      ? `1 ${c.code} = <span class="rate-val">${fmtRate(c.code,rate,true)}</span> USD`
      : `1 USD = <span class="rate-val">${fmtRate(c.code,rate)}</span> ${c.code}`;
    const convStr = (rate && amount > 0 && amount !== 1)
      ? `<div class="card-conv">${c.invert
          ? `${fmtConv(c.code,rate,true,amount)} ${c.code} → $${amount.toLocaleString()}`
          : `$${amount.toLocaleString()} → <span class="conv-val">${fmtConv(c.code,rate,false,amount)}</span> ${c.code}`
        }</div>` : '';

    html += `
      <div class="card" style="animation-delay:${i*0.04}s">
        <div class="card-flag">${c.flag}</div>
        <div class="card-body">
          <div class="card-top">
            <div><span class="card-name">${c.name}</span><span class="card-code">${c.code}</span></div>
            <div class="badges">${badgeHTML(yoyPct,loadingYoy)}${badgeHTML(mtdPct,loadingMtd)}${badgeHTML(ytdPct,loadingYtd)}</div>
          </div>
          <div class="card-rate">${rateStr}</div>
          ${convStr}
        </div>
      </div>`;
  });

  const mmLabel = String(CM+1).padStart(2,'0');

  html += `</div>
    <div class="legend">
      <span><span style="color:#52c98a">▲</span> 해당 통화 강세 (USD 대비)</span>
      <span><span style="color:#e86060">▼</span> 해당 통화 약세</span>
      <span class="legend-sep">│</span>
      <span>전년비: 오늘 vs ${yearAgoISO}</span>
      <span class="legend-sep">│</span>
      <span>MTD: ${CY}.${mmLabel}.01~오늘 평균 vs ${PY} 동기 평균</span>
      <span class="legend-sep">│</span>
      <span>YTD: ${CY}.01~오늘 평균 vs ${PY} 동기 평균</span>
      <span class="legend-sep">│</span>
      <span>MTD: ${CY}.${mmLabel}.01~오늘 평균 vs ${PY} 동기 평균</span>
    </div>

    ${renderFxImpact()}

    ${renderFxOutlook()}

    <div class="footer">참고용 환율 · 실제 거래 환율과 다를 수 있음 · 데이터: fawazahmed0 Currency API (ECB 기반, 영업일 기준)</div>`;

  content.innerHTML = html;
}

function updateStatus(msg, extra) {
  const el = document.getElementById('status');
  let html = msg ? `<span>${msg}</span>` : '';
  if (extra) html += `<span class="status-dim">${extra}</span>`;
  el.innerHTML = html;
}

function initDatePicker() {
  const picker = document.getElementById('datePicker');
  const today = toLocalISO(prevWD(new Date()));
  picker.value = today;
  picker.max = today;
  picker.min = '2020-01-02';
}

function onDateChange(val) {
  if (!val) return;
  selectedDate = prevWD(new Date(val));
  rates={}; yoyRates={cur:{},prev:{}}; ytdRates={cur:{},prev:{}}; mtdRates={cur:{},prev:{}}; fcastRefRates={m1:{},m3:{}};
  loadingYoy=true; loadingYtd=true; loadingMtd=true; loadingFcastRef=true;
  fetchAll(false);
}

function resetToToday() {
  selectedDate = prevWD(new Date());
  const today = toLocalISO(selectedDate);
  document.getElementById('datePicker').value = today;
  rates={}; yoyRates={cur:{},prev:{}}; ytdRates={cur:{},prev:{}}; mtdRates={cur:{},prev:{}}; fcastRefRates={m1:{},m3:{}};
  loadingYoy=true; loadingYtd=true; loadingMtd=true; loadingFcastRef=true;
  fetchAll(false);
}

async function fetchAll(isRefresh) {
  const btn = document.getElementById('refreshBtn');
  if (isRefresh) { btn.disabled=true; btn.textContent='⟳ 업데이트 중...'; loadPolicyRates(); }
  loadingYoy=true; loadingYtd=true; loadingMtd=true; loadingFcastRef=true;

  // 날짜 변수 갱신
  ({ CY, PY, CM, yearAgoISO, ytdStartISO, ytdEndISO, prevYtdStartISO, prevYtdEndISO, mtdStartISO, mtdEndISO, prevMtdStartISO, prevMtdEndISO, fcastRef1mISO, fcastRef3mISO } = getDateVars(selectedDate));
  const isToday = toLocalISO(selectedDate) === toLocalISO(prevWD(new Date()));
  const fetchDateISO = isToday ? null : toLocalISO(selectedDate);

  try {
    const current = await cdnFetch(fetchDateISO);
    if (!Object.keys(current).length) throw new Error();
    rates = current;
    const dateLabel = isToday ? '오늘' : toLocalISO(selectedDate);
    updateStatus(dateLabel + ' · fawazahmed0', '전년비 · YTD · MTD 로딩중...');
    const sk = document.getElementById('skeleton');
    if (sk) sk.remove();
    renderGrid();
  } catch {
    document.getElementById('content').innerHTML = '<div class="error-box">⚠ 환율 데이터를 불러올 수 없습니다. 날짜를 확인하거나 인터넷 연결을 확인해주세요.</div>';
    if (isRefresh) { btn.disabled=false; btn.textContent='⟳ 새로고침'; }
    return;
  }
  if (isRefresh) { btn.disabled=false; btn.textContent='⟳ 새로고침'; }

  ;(async () => {
    try {
      const [cp, pp] = await Promise.all([cdnFetch(fetchDateISO), cdnFetch(yearAgoISO)]);
      yoyRates = {cur:cp, prev:pp};
    } catch {}
    loadingYoy = false;
    const dateLabel = isToday ? '오늘' : toLocalISO(selectedDate);
    updateStatus(dateLabel + ' · fawazahmed0', (loadingYtd||loadingMtd) ? 'YTD · MTD 로딩중...' : '');
    renderGrid();
  })();

  ;(async () => {
    try {
      const curAvg  = await cdnAvg(ytdStartISO, ytdEndISO);
      const prevAvg = await cdnAvg(prevYtdStartISO, prevYtdEndISO);
      ytdRates = {cur:curAvg, prev:prevAvg};
    } catch {}
    loadingYtd = false;
    const dateLabel = isToday ? '오늘' : toLocalISO(selectedDate);
    updateStatus(dateLabel + ' · fawazahmed0', loadingMtd ? 'MTD 로딩중...' : '');
    renderGrid();
  })();

  ;(async () => {
    try {
      const curAvg  = await cdnAvg(mtdStartISO, mtdEndISO);
      const prevAvg = await cdnAvg(prevMtdStartISO, prevMtdEndISO);
      mtdRates = {cur:curAvg, prev:prevAvg};
    } catch {}
    loadingMtd = false;
    const dateLabel = isToday ? '오늘' : toLocalISO(selectedDate);
    updateStatus(dateLabel + ' · fawazahmed0', loadingFcastRef ? '예측 로딩중...' : '');
    renderGrid();
  })();

  ;(async () => {
    try {
      const [m1, m3] = await Promise.all([cdnFetch(fcastRef1mISO), cdnFetch(fcastRef3mISO)]);
      fcastRefRates = { m1, m3 };
    } catch {}
    loadingFcastRef = false;
    const dateLabel = isToday ? '오늘' : toLocalISO(selectedDate);
    updateStatus(dateLabel + ' · fawazahmed0');
    renderGrid();
  })();
}

document.getElementById('usdInput').addEventListener('input', () => {
  if (Object.keys(rates).length) renderGrid();
});

initDatePicker();
fetchAll(false);
loadPolicyRates();

function loadPolicyRates() {
  loadingPolicyRates = true;
  fetchPolicyRates().then(raw => {
    const out = {};
    if (raw.US != null) out.US = raw.US;
    Object.entries(POLICY_AREA_TO_CCY).forEach(([area, ccy]) => { if (raw[area] != null) out[ccy] = raw[area]; });
    policyRates = out;
    loadingPolicyRates = false;
    renderGrid();
  });
}

function downloadHTML() {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = toLocalISO(selectedDate).replace(/-/g,'');
  a.href     = url;
  a.download = `asia-fx-${date}.html`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
